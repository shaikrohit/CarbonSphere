<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍃</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CarbonSphere - Interactive Carbon Footprint Tracker and Awareness Platform. Calculate baseline emissions, visualize impact on an EcoSphere, and compete in team leaderboards." />
    <meta name="keywords" content="carbon footprint, carbon awareness, sustainability, eco-friendly, green habit tracker, AI carbon assistant" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <title>CarbonSphere - Interactive Carbon Footprint Awareness Platform</title>
    <style>
      body {
        background-color: #0a0b10;
        margin: 0;
      }
      .app-loading-screen {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        width: 100vw;
        color: #f3f4f6;
        background-color: #0a0b10;
      }
      .loader-logo {
        font-size: 52px;
        margin-bottom: 24px;
        animation: pulse 1.6s ease-in-out infinite;
      }
      .loader-spinner {
        width: 32px;
        height: 32px;
        border: 3px solid rgba(0, 230, 118, 0.1);
        border-radius: 50%;
        border-top-color: #00e676;
        animation: spin 1s ease-in-out infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.1); opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-loading-screen">
        <div class="loader-logo">🍃</div>
        <div class="loader-spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
